[project]
name = "passive-liveness-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Amogh Shakya", email = "amoghshakya@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.142.2",
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "pillow>=12.3.0",
  "pydantic-settings>=2.15.0",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
  "transformers>=5.18.0",
]

[project.scripts]
passive-liveness-v2 = "passive_liveness_v2.main:run"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
