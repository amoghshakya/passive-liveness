<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>passive liveness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0D1218;
      --panel: #131A22;
      --hairline: #2A3440;
      --text: #E8EAEC;
      --muted: #9AA6B2;
      --signal: #3FD9B6;
      --attack: #E4572E;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 20px 64px;
    }

    .wrap {
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 34px;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      margin: 6px 0 28px;
      max-width: 60ch;
    }

    /* ---- viewfinder ---- */

    .viewfinder {
      position: relative;
      aspect-ratio: 4 / 3;
      background: var(--panel);
      border: 1px dashed var(--hairline);
      border-radius: 4px;
      overflow: hidden;
    }

    .viewfinder.live {
      border-style: solid;
    }

    .viewfinder.drag {
      border-color: var(--text);
    }

    .viewfinder video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: 1px solid oklch(1 0 0 / 0.1);
    }

    .still {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: 1px solid oklch(1 0 0 / 0.1);
    }

    .bracket {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 0 solid var(--muted);
      transition: border-color 300ms ease-out;
    }

    .bracket.tl {
      top: 10px;
      left: 10px;
      border-top-width: 2px;
      border-left-width: 2px;
    }

    .bracket.tr {
      top: 10px;
      right: 10px;
      border-top-width: 2px;
      border-right-width: 2px;
    }

    .bracket.bl {
      bottom: 10px;
      left: 10px;
      border-bottom-width: 2px;
      border-left-width: 2px;
    }

    .bracket.br {
      bottom: 10px;
      right: 10px;
      border-bottom-width: 2px;
      border-right-width: 2px;
    }

    @keyframes bracket-pulse {
      0% {
        border-color: var(--text);
      }

      100% {
        border-color: var(--muted);
      }
    }

    .viewfinder.capturing .bracket {
      animation: bracket-pulse 600ms ease-out;
    }

    .viewfinder.analyzing .bracket {
      border-color: var(--text);
    }

    .idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 24px;
    }

    .idle[hidden] {
      display: none;
    }

    .idle-title {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .idle-sub {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
      max-width: 42ch;
    }

    /* ---- verdict panel: replaces the viewfinder content ---- */

    .verdict-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--panel);
      text-align: center;
      padding: 24px;
    }

    .verdict-panel[hidden] {
      display: none;
    }

    .verdict-panel:not([hidden]) {
      animation: panel-in 240ms cubic-bezier(0.2, 0, 0, 1);
    }

    @keyframes panel-in {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
    }

    .verdict-mark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin-bottom: 10px;
    }

    .verdict-mark svg {
      width: 32px;
      height: 32px;
    }

    /* hidden on SVG is not styled by every UA stylesheet,
       so hide it explicitly. */
    .verdict-mark svg[hidden] {
      display: none;
    }

    .verdict-panel.live .verdict-mark {
      color: var(--signal);
      background: rgba(63, 217, 182, 0.16);
    }

    .verdict-panel.spoof .verdict-mark {
      color: var(--attack);
      background: rgba(228, 87, 46, 0.16);
    }

    .verdict-panel:not([hidden]) .verdict-mark svg {
      animation: mark-in 240ms cubic-bezier(0.2, 0, 0, 1);
    }

    @keyframes mark-in {
      from {
        transform: scale(0.25);
        opacity: 0;
        filter: blur(4px);
      }
    }

    .verdict-label {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .verdict-panel.live .verdict-label {
      color: var(--signal);
    }

    .verdict-panel.spoof .verdict-label {
      color: var(--attack);
    }

    .verdict-score {
      color: var(--muted);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      margin: 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---- controls ---- */

    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .btn {
      font: 500 14px/1 'Inter', system-ui, sans-serif;
      padding: 11px 18px;
      border-radius: 4px;
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .btn-primary {
      background: var(--signal);
      border-color: var(--signal);
      color: var(--ink);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-text {
      border: none;
      padding: 4px 0;
      color: var(--muted);
    }

    .btn-text:hover {
      color: var(--text);
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch-track {
      width: 32px;
      height: 18px;
      border-radius: 9px;
      background: var(--hairline);
      position: relative;
      transition: background 200ms ease-out;
      flex: none;
    }

    .switch-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text);
      transition: left 200ms ease-out;
    }

    .switch input:checked+.switch-track {
      background: var(--signal);
    }

    .switch input:checked+.switch-track::after {
      left: 16px;
    }

    :focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }

    .switch input:focus-visible+.switch-track {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }

    /* ---- verdict status ---- */

    .verdict {
      margin-top: 22px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      min-height: 20px;
      margin: 0 0 8px;
    }

    /* ---- error ---- */

    .error {
      margin-top: 16px;
      padding: 10px 12px;
      border: 1px solid var(--attack);
      border-radius: 4px;
      font-size: 14px;
    }

    .error code {
      display: block;
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-size: 12px;
      color: var(--attack);
      margin-bottom: 2px;
    }

    /* ---- footer ---- */

    .footer {
      margin-top: 30px;
      padding-top: 14px;
      border-top: 1px solid var(--hairline);
      color: var(--muted);
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>passive liveness</h1>
    <p class="subtitle">Press verify. A short burst is captured on-device,
      the sharpest frames are sent to the server, and the majority vote decides.</p>

    <div class="viewfinder" id="viewfinder">
      <video id="video" muted playsinline autoplay></video>
      <img class="still" id="still" alt="Uploaded frame" hidden>
      <span class="bracket tl"></span>
      <span class="bracket tr"></span>
      <span class="bracket bl"></span>
      <span class="bracket br"></span>
      <div class="idle" id="idle">
        <p class="idle-title" id="idle-title">Requesting camera…</p>
        <p class="idle-sub" id="idle-sub">Allow camera access when the
          browser asks — the viewfinder needs it to verify liveness.</p>
        <button class="btn btn-text" id="browse" type="button">or upload a frame</button>
      </div>

      <div class="verdict-panel" id="verdict-panel" hidden>
        <div class="verdict-mark" id="verdict-mark">
          <svg id="mark-live" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <svg id="mark-spoof" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M18 6 6 18M6 6l12 12"/></svg>
        </div>
        <p class="verdict-label" id="verdict-label">Live</p>
        <p class="verdict-score" id="verdict-score"></p>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="check" type="button" disabled>Verify liveness</button>
      <label class="switch">
        <input type="checkbox" id="skip-detection">
        <span class="switch-track"></span>
        Skip detection
      </label>
      <button class="btn btn-text" id="take-photo" type="button">Take photo</button>
      <button class="btn btn-text" id="upload" type="button">Upload photo</button>
      <input type="file" id="file-camera" accept="image/*" capture="user" hidden>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <section class="verdict" aria-live="polite">
      <p class="status" id="status">ready</p>
      <span class="visually-hidden" id="verdict-announcer"></span>
    </section>

    <div class="error" id="error" hidden>
      <code id="error-code"></code>
      <span id="error-message"></span>
    </div>

    <footer class="footer" id="model-meta">loading model&hellip;</footer>
  </main>

  <script>
    (() => {
      'use strict';

      var BUFFER_SECONDS = 2;
      var SAMPLE_FPS = 5;
      var MAX_SIDE = 1280;
      var MAX_BURST_FRAMES = 5;
      var BURST_MIN_GAP = 2;

      var GUIDANCE = {
        no_face_detected: 'No face in frame. Hold your face in the viewfinder and try again.',
        low_confidence: 'Face unclear. Move closer to the camera and try again.',
        face_too_small: 'Face too small. Move closer to the camera.',
        low_quality: 'Frame too blurry. Improve the lighting or hold still.',
        extreme_pose: 'Pose too extreme. Face the camera straight on.',
        invalid_bbox: 'Detection failed. Try again.',
        geometry_extraction_failed: 'Face geometry could not be read. Try again.',
        invalid_image: 'That file is not a decodable image.',
        unsupported_media_type: 'Expected an image file.',
        file_too_large: 'File exceeds the configured size limit.',
        empty_upload: 'The uploaded file was empty.',
        invalid_burst: 'Send between 1 and 8 frames from the same burst.',
        service_unavailable: 'Model is still loading. Try again in a moment.',
        internal_error: 'Something went wrong on the server.'
      };

      var viewfinder = document.getElementById('viewfinder');
      var video = document.getElementById('video');
      var still = document.getElementById('still');
      var idle = document.getElementById('idle');
      var idleTitle = document.getElementById('idle-title');
      var idleSub = document.getElementById('idle-sub');
      var browseBtn = document.getElementById('browse');
      var checkBtn = document.getElementById('check');
      var skipDetectionInput = document.getElementById('skip-detection');
      var takePhotoBtn = document.getElementById('take-photo');
      var uploadBtn = document.getElementById('upload');
      var fileInput = document.getElementById('file');
      var cameraInput = document.getElementById('file-camera');
      var statusEl = document.getElementById('status');
      var announcer = document.getElementById('verdict-announcer');
      var verdictPanel = document.getElementById('verdict-panel');
      var markLive = document.getElementById('mark-live');
      var markSpoof = document.getElementById('mark-spoof');
      var verdictLabel = document.getElementById('verdict-label');
      var verdictScore = document.getElementById('verdict-score');
      var errorBox = document.getElementById('error');
      var errorCode = document.getElementById('error-code');
      var errorMessage = document.getElementById('error-message');
      var footerEl = document.getElementById('model-meta');

      var state = {
        stream: null,
        buffer: [],
        sampler: null,
        inFlight: false,
        verified: false
      };

      function setStatus(text) {
        statusEl.textContent = text;
      }

      // The Verify button carries the busy state: disabled
      // and relabeled while a cycle runs, so in-flight
      // cycles drop dead clicks instead of ignoring them.
      function setBusy(busy) {
        checkBtn.disabled = busy || !state.stream;
        checkBtn.textContent = busy
          ? 'Verifying…'
          : (state.verified ? 'Verify again' : 'Verify liveness');
      }

      // Match the viewfinder to the content so it never crops
      // (object-fit: cover becomes an exact fit at equal aspect).
      // Clamped to [1:2, 2:1] so extreme panoramas or tall
      // crops keep a sane box; overflow there still crops.
      function fitViewfinder(w, h) {
        if (!w || !h) return;
        var ratio = w / h;
        if (ratio < 0.5) ratio = 0.5;
        if (ratio > 2) ratio = 2;
        viewfinder.style.aspectRatio = String(ratio);
      }

      /* ---- camera ---- */

      function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          cameraUnavailable('Camera capture needs a secure (HTTPS) connection.');
          return;
        }
        navigator.mediaDevices.getUserMedia({
          video: {facingMode: 'user', width: {ideal: 1280}, height: {ideal: 720}},
          audio: false
        }).then(function (stream) {
          state.stream = stream;
          video.srcObject = stream;
          return video.play();
        }).then(function () {
          idle.hidden = true;
          still.hidden = true;
          video.hidden = false;
          viewfinder.classList.add('live');
          fitViewfinder(video.videoWidth, video.videoHeight);
          setBusy(false);
          setStatus('camera on');
          state.sampler = setInterval(sample, 1000 / SAMPLE_FPS);
        }).catch(function (err) {
          cameraUnavailable(err.name === 'NotAllowedError'
            ? 'Permission denied. Allow camera access and reload the page, or upload a photo instead.'
            : 'The in-browser camera needs HTTPS (it works on localhost). Upload a photo instead, or tunnel this server (e.g. ngrok http 8000) and reopen the page.');
        });
      }

      function cameraUnavailable(message) {
        idleTitle.textContent = 'No live camera';
        idleSub.textContent = message;
        setStatus('camera unavailable');
      }

      /* ---- burst buffer + sharpness ---- */

      function grabFrame() {
        if (!video.videoWidth) return null;
        var scale = Math.min(1, MAX_SIDE / video.videoWidth);
        var w = Math.max(1, Math.round(video.videoWidth * scale));
        var h = Math.max(1, Math.round(video.videoHeight * scale));
        var c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        c.getContext('2d').drawImage(video, 0, 0, w, h);
        return c;
      }

      // Variance of the Laplacian on a small grayscale copy —
      // the standard focus measure, same signal the server uses.
      function sharpness(canvas) {
        var S = 160;
        var scale = Math.min(1, S / canvas.width);
        var w = Math.max(2, Math.round(canvas.width * scale));
        var h = Math.max(2, Math.round(canvas.height * scale));
        var c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        var ctx = c.getContext('2d');
        ctx.drawImage(canvas, 0, 0, w, h);
        var d = ctx.getImageData(0, 0, w, h).data;
        var g = new Float32Array(w * h);
        for (var i = 0; i < w * h; i++) {
          var j = i * 4;
          g[i] = d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114;
        }
        var sum = 0, sum2 = 0, n = 0;
        for (var y = 1; y < h - 1; y++) {
          for (var x = 1; x < w - 1; x++) {
            var k = y * w + x;
            var lap = g[k - w] + g[k + w] + g[k - 1] + g[k + 1] - 4 * g[k];
            sum += lap;
            sum2 += lap * lap;
            n++;
          }
        }
        if (n < 2) return 0;
        var mean = sum / n;
        return sum2 / n - mean * mean;
      }

      function sample() {
        var c = grabFrame();
        if (!c) return;
        state.buffer.push({canvas: c, sharpness: sharpness(c)});
        if (state.buffer.length > BUFFER_SECONDS * SAMPLE_FPS) state.buffer.shift();
      }

      // Up to MAX_BURST_FRAMES sharpest frames, spaced at
      // least BURST_MIN_GAP buffer slots apart so the vote
      // isn't fed near-duplicate frames.
      function pickBurst() {
        if (state.buffer.length === 0) {
          var c = grabFrame();
          return c ? [{canvas: c, sharpness: sharpness(c)}] : [];
        }
        var order = state.buffer.map(function (f, i) {
          return {frame: f, index: i};
        });
        order.sort(function (a, b) {
          return b.frame.sharpness - a.frame.sharpness;
        });
        var picked = [];
        for (var i = 0; i < order.length && picked.length < MAX_BURST_FRAMES; i++) {
          var candidate = order[i];
          var spaced = picked.every(function (p) {
            return Math.abs(p.index - candidate.index) >= BURST_MIN_GAP;
          });
          if (spaced) picked.push(candidate);
        }
        return picked.map(function (p) { return p.frame; });
      }

      function pulseBrackets() {
        viewfinder.classList.remove('capturing');
        void viewfinder.offsetWidth; // restart the pulse animation
        viewfinder.classList.add('capturing');
      }

      /* ---- analysis ---- */

      function analyze() {
        if (state.inFlight) return;
        var frames = pickBurst();
        if (frames.length === 0) return;
        state.inFlight = true;
        setBusy(true);
        pulseBrackets();
        viewfinder.classList.add('analyzing');
        verdictPanel.hidden = true;
        setStatus('verifying…');
        errorBox.hidden = true;

        var blobs = frames.map(function (frame) {
          return new Promise(function (resolve) {
            frame.canvas.toBlob(resolve, 'image/jpeg', 0.85);
          });
        });

        Promise.all(blobs).then(function (blobList) {
          if (blobList.some(function (b) { return !b; })) {
            throw {code: 'empty_upload', message: 'Could not encode the frames.'};
          }
          var fd = new FormData();
          var endpoint;
          if (blobList.length === 1) {
            fd.append('file', blobList[0], 'frame.jpg');
            endpoint = '/v1/liveness';
          } else {
            blobList.forEach(function (blob, i) {
              fd.append('files', blob, 'frame_' + i + '.jpg');
            });
            endpoint = '/v1/liveness/burst';
          }
          if (skipDetectionInput.checked) fd.append('skip_detection', 'true');
          return fetch(endpoint, {method: 'POST', body: fd});
        }).then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok) throw toError(data);
            renderVerdict(data);
          });
        }).catch(function (err) {
          renderError(err);
        }).finally(function () {
          state.inFlight = false;
          setBusy(false);
          viewfinder.classList.remove('analyzing');
          if (!state.stream) setStatus('ready');
        });
      }

      function analyzeFile(file) {
        if (!file || state.inFlight) return;
        state.inFlight = true;
        setBusy(true);
        pulseBrackets();
        viewfinder.classList.add('analyzing');
        verdictPanel.hidden = true;
        setStatus('verifying…');
        errorBox.hidden = true;

        // Preview the frame in the viewfinder so the evaluation is visible,
        // then send it to the server.
        var url = URL.createObjectURL(file);
        var probe = new Image();
        probe.onload = function () {
          idle.hidden = true;
          fitViewfinder(probe.naturalWidth, probe.naturalHeight);
          still.src = url;
          still.hidden = false;
          video.hidden = true;
          uploadAndRender(file);
        };
        probe.onerror = function () {
          uploadAndRender(file, null);
        };
        probe.src = url;
      }

      function uploadAndRender(file) {
        var fd = new FormData();
        fd.append('file', file);
        if (skipDetectionInput.checked) fd.append('skip_detection', 'true');
        fetch('/v1/liveness', {method: 'POST', body: fd})
          .then(function (res) {
            return res.json().then(function (data) {
              if (!res.ok) throw toError(data);
              renderVerdict(data);
            });
          })
          .catch(function (err) {
            renderError(err);
          })
          .finally(function () {
            state.inFlight = false;
            setBusy(false);
            viewfinder.classList.remove('analyzing');
            if (!state.stream) setStatus('ready');
          });
      }

      function toError(data) {
        var e = (data && data.error) || {};
        return {code: e.code || 'internal_error', message: e.message || 'Unexpected server error.'};
      }

      /* ---- rendering ---- */

      function renderVerdict(data) {
        var live = data.label === 'live';

        verdictLabel.textContent = live ? 'Live' : 'Spoof';
        verdictScore.textContent =
          'score ' + data.score.toFixed(3) +
          (data.skip_detection ? ' · detection skipped' : '') +
          (data.counts
            ? ' · ' + data.counts.live + '/' + (data.counts.live + data.counts.spoof) + ' frames live'
            : '');

        markLive.hidden = !live;
        markSpoof.hidden = live;
        verdictPanel.className = 'verdict-panel ' + data.label;
        verdictPanel.hidden = false;

        state.verified = true;
        announcer.textContent =
          (live ? 'Live' : 'Spoof') + ', score ' + data.score.toFixed(3);

        var rid = (data.request_id || '').slice(0, 8);
        setStatus('verdict · ' + rid);
      }

      function renderError(err) {
        var code = err.code || 'internal_error';
        errorCode.textContent = code;
        errorMessage.textContent =
          GUIDANCE[code] || err.message || 'Something went wrong. Try again.';
        errorBox.hidden = false;
        setStatus('error');
      }

      /* ---- wiring ---- */

      browseBtn.addEventListener('click', function () {fileInput.click();});
      takePhotoBtn.addEventListener('click', function () {cameraInput.click();});
      uploadBtn.addEventListener('click', function () {fileInput.click();});
      checkBtn.addEventListener('click', analyze);
      fileInput.addEventListener('change', function () {
        analyzeFile(fileInput.files[0]);
        fileInput.value = '';
      });
      cameraInput.addEventListener('change', function () {
        analyzeFile(cameraInput.files[0]);
        cameraInput.value = '';
      });

      viewfinder.addEventListener('dragover', function (e) {
        e.preventDefault();
        viewfinder.classList.add('drag');
      });
      viewfinder.addEventListener('dragleave', function () {
        viewfinder.classList.remove('drag');
      });
      viewfinder.addEventListener('drop', function (e) {
        e.preventDefault();
        viewfinder.classList.remove('drag');
        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file && file.type.indexOf('image/') === 0) analyzeFile(file);
      });

      /* ---- boot: request the camera on page load, no enable step ---- */

      setStatus('starting camera…');
      startCamera();

      // Model metadata: footer.
      fetch('/v1/ready')
        .then(function (r) {return r.json();})
        .then(function (m) {
          footerEl.textContent = m.model.name + ' · ' + m.model.backbone +
            ' · ' + m.model.device + ' · threshold ' + m.model.threshold.toFixed(4);
        })
        .catch(function () {
          footerEl.textContent = 'model metadata unavailable';
        });
    })();
  </script>
</body>

</html>
